[project]
name = "mrl-quant-ja"
version = "0.1.0"
description = "EmbeddingGemma 2 Matryoshka truncation x quantization Pareto on Japanese retrieval (JQaRA)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "sentence-transformers>=6.1.0",
    "transformers>=5.20",
    "torch>=2.6",
    "datasets>=3.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "faiss-cpu>=1.9",
    "bm25s>=0.2.10",
    "fugashi>=1.4",
    "unidic-lite>=1.0.8",
    "ranx>=0.3.20",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "matplotlib>=3.9",
    "tabulate>=0.9",
    "torchvision>=0.29.1",
    "pillow>=13.0.0",
    "onnxscript>=0.7.2",
]

[project.optional-dependencies]
notebook = ["jupyter>=1.1"]

[project.scripts]
mrlqj = "mrl_quant_ja.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mrl_quant_ja"]
